<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 link-share preview image.
  Rendered by script/og/render-og-image.sh with headless Chromium. Re-run that
  script after editing this file, then commit the PNG.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "NotoSansOG";
        src: url("../../fonts/notosans/notosans-bold.otf");
        font-weight: 700;
      }
      @font-face {
        font-family: "NotoSansOG";
        src: url("../../fonts/notosans/notosans-medium.otf");
        font-weight: 500;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 640px 560px;
        font-family: "NotoSansOG", sans-serif;
        background: #022c22; /* emerald-950 */
        color: #ecfdf5;
      }
      .panel {
        position: relative;
        padding: 64px 40px 56px 64px;
        display: flex;
        flex-direction: column;
        background: #064e3b; /* emerald-900, the site's heading colour */
      }
      .panel::after {
        /* hard vertical rule where the photo starts, in the site's accent green */
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 10px;
        background: #10b981; /* emerald-500 */
      }
      .mark {
        width: 88px;
        height: 88px;
        display: block;
      }
      h1 {
        margin-top: 60px;
        font-weight: 700;
        font-size: 84px;
        line-height: 1;
        letter-spacing: -2.5px;
        white-space: nowrap;
      }
      h1 .accent {
        color: #34d399;
      } /* emerald-400 */
      .tag {
        margin-top: 32px;
        font-weight: 500;
        font-size: 27px;
        line-height: 1.3;
        color: #a7f3d0; /* emerald-200 */
      }
      .url {
        margin-top: auto;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.5px;
        color: #6ee7b7; /* emerald-300 */
      }
      .photo {
        background-image: url("../../src/photos/events/atm46/PXL_20250813_235422629.jpg");
        background-size: cover;
        background-position: 78% 50%;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <svg
        class="mark"
        viewBox="0 0 300 300"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <g fill="#ecfdf5" fill-rule="nonzero">
          <path d="m170 160v140h-40v-140" />
          <path d="m220 160v40h-140v-40z" />
          <path d="m300 40v260h-40v-260" />
          <path d="m40 40v260h-40v-260" />
          <path d="m0 80h300v40h-300" />
          <path d="m40 0h221v40h-221" />
        </g>
      </svg>
      <h1>Astoria Tech<br /><span class="accent">Meetup</span></h1>
      <p class="tag">
        Grassroots tech community in Queens.<br />Mornings, evenings,
        hackathons.
      </p>
      <p class="url">meetup.astoria.app</p>
    </div>
    <div
      class="photo"
      role="img"
      aria-label="A packed room watching a talk at Astoria Tech Meetup"
    ></div>
  </body>
</html>
