name: Scheduled Deploy

# Kept the GitHub Pages site fresh with latest Meetup API data every 2 hours.
#
# DISABLED: the live site now lives on the Pi (meetup.astoria.app), where a systemd
# timer rebuilds it every 4h; the astoria.app apex 302s there. GitHub Pages no longer
# serves the apex, so the schedule is off. Restore the `schedule:` cron below to
# resume periodic GitHub Pages redeploys.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
