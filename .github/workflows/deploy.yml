name: Deploy

# responsbile for deploying the site to GitHub Pages
#
# NOTE: the live site is now self-hosted on the Pi at meetup.astoria.app, and the
# astoria.app apex issues a temporary 302 there (see the http-routing project).
# GitHub Pages no longer serves the apex, so automatic deploys are disabled — this
# runs only by hand (workflow_dispatch) or when called by another workflow. Re-add a
# `push:` trigger here to resume auto-publishing to GitHub Pages.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        env:
          ASTRO_CONFIG_SITE: ${{ secrets.ASTRO_CONFIG_SITE }}
          ASTRO_CONFIG_BASE: ${{ secrets.ASTRO_CONFIG_BASE }}
        with:
          path: .
          node-version: 20
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
